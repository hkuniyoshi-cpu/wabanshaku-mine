<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1815"/>
      <stop offset="55%" stop-color="#231F1B"/>
      <stop offset="100%" stop-color="#0F0D0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#B08A3E" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#B08A3E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="420" fill="url(#glow)"/>

  <!-- Delicate framing lines -->
  <line x1="80" y1="80" x2="240" y2="80" stroke="#B08A3E" stroke-width="1" opacity="0.55"/>
  <line x1="80" y1="80" x2="80" y2="200" stroke="#B08A3E" stroke-width="1" opacity="0.55"/>
  <line x1="1120" y1="550" x2="960" y2="550" stroke="#B08A3E" stroke-width="1" opacity="0.55"/>
  <line x1="1120" y1="550" x2="1120" y2="430" stroke="#B08A3E" stroke-width="1" opacity="0.55"/>

  <!-- English top eyebrow -->
  <text x="600" y="150" text-anchor="middle" font-family="'Cormorant Garamond','Playfair Display',serif" font-size="24" font-weight="400" fill="#B08A3E" letter-spacing="18" font-style="italic">A quiet evening in Naha</text>

  <!-- Main JP title -->
  <text x="600" y="310" text-anchor="middle" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="120" font-weight="600" fill="#F0E7D5" letter-spacing="30">和晩酌  嶺</text>

  <!-- Rule -->
  <line x1="540" y1="358" x2="660" y2="358" stroke="#B08A3E" stroke-width="1.2"/>

  <!-- English title -->
  <text x="600" y="410" text-anchor="middle" font-family="'Cormorant Garamond','Playfair Display',serif" font-size="42" font-weight="400" fill="#E8DFCB" letter-spacing="14">Wa Banshaku Mine</text>

  <!-- Sub description -->
  <text x="600" y="480" text-anchor="middle" font-family="'Noto Serif JP',serif" font-size="22" font-weight="400" fill="#C9B98E" letter-spacing="10">創作和食と日本酒。ゆるりと、深く。</text>

  <!-- Bottom bar -->
  <text x="600" y="565" text-anchor="middle" font-family="'Noto Serif JP',serif" font-size="16" fill="#8E8678" letter-spacing="8">沖縄 那覇 久米  ／  Naha, Okinawa</text>
</svg>
